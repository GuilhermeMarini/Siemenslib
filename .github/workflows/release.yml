name: Release

# Pushing a `v*` tag publishes that version to PyPI and opens a GitHub
# release. Everything that can say no runs BEFORE the upload, and the GitHub
# release is created after it: a release row can be deleted and written again,
# a PyPI file cannot.
#
# ONE-TIME SETUP, on PyPI and not here: this uses trusted publishing (OIDC),
# so no API token is stored in the repository. `siemenslib` is a NEW project --
# there is nothing on PyPI to attach a publisher to yet -- so the first
# release needs a PENDING publisher, added at
# https://pypi.org/manage/account/publishing/ with PyPI project `siemenslib`,
# owner `GuilhermeMarini`, repository `Siemenslib`, workflow `release.yml` and
# the environment field left EMPTY (this workflow declares none; anything
# typed there fails to match and the upload is refused as `invalid-publisher`).
# It becomes an ordinary publisher once the first upload succeeds.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the GitHub release
  id-token: write     # PyPI trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag and both version literals must agree
        # The version is carried TWICE -- `version` in pyproject.toml and
        # `__version__` in `src/siemenslib/__init__.py` -- and the drift between
        # them is silent and has a direction: a release bumps pyproject, the
        # wheel goes to PyPI, and the installed package still answers the old
        # number when asked. Checked here as well as in the suite because a
        # tag can be pushed at any commit, including one CI never ran.
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          meta = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          pyproject = meta["project"]["version"]
          src = pathlib.Path("src/siemenslib/__init__.py").read_text()
          literal = re.search(r'^__version__ = "([^"]+)"', src, re.M).group(1)

          if not (tag == pyproject == literal):
              sys.exit(f"::error::tag v{tag}, pyproject.toml {pyproject}, "
                       f"__version__ {literal} -- all three must agree")
          print(f"v{tag} agrees with pyproject.toml and __version__")
          PY

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy

      - name: Tests
        # Run again here rather than trusted from the CI job on main, for the
        # same reason the version check is repeated: this tag may point at a
        # commit that job never saw. The reference station is absent here,
        # so the test that reads a real SCD skips -- expected, and why the
        # synthetic fixture carries the shapes that matter.
        run: python -m pytest tests/ -q

      - name: Build
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: The wheel must carry py.typed and the licence
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          missing = [w for w in ("siemenslib/py.typed", "LICENSE")
                     if not any(w in n for n in names)]
          sys.exit(f"missing from the wheel: {missing}" if missing else 0)
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Siemenslib $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

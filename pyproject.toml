[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siemenslib"
version = "0.2.1"
description = "Read what DIGSI writes into an SCL file beside the standard: SIPROTEC product codes, application templates and GOOSE applications"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Marini" }]
keywords = ["siemens", "siprotec", "digsi", "scl", "scd", "iec61850",
            "goose", "protection", "relay", "commissioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
# The STANDARD half of an SCL file is deliberately not read here, and now it
# has a vendor-neutral home to be read from: `py61850.scl` builds the document
# and the IED model, and this library reads its own `Private` elements off
# those nodes. It parses no XML of its own -- a second reader for one standard
# format would be two things to keep right instead of one.
#
# `>=0.3.0` and not `>=0.3.0.dev2`: the final is published, so the pin no longer
# has to name a pre-release. Keep it that way -- a specifier naming a `.devN`
# tells the resolver pre-releases are acceptable for this requirement, which
# would keep letting a future `0.4.0.dev1` in on a fresh install.
dependencies = ["py61850>=0.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/GuilhermeMarini/Siemenslib"
Source = "https://github.com/GuilhermeMarini/Siemenslib"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siemenslib = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
